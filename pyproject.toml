[project]
name = "africanlanguages"
version = "0.1.0"
description = "Utilities for African languages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cyclopts>=3.24.0",
    "pycountry>=24.6.1",
    "pydantic>=2.0",
    "datasets>=2.14.0",
    "regex>=2025.11.3",
]

[tool.uv]
package = true
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.13.1",
]

## Imports and formatting
[tool.ruff]
line-length = 120
lint.ignore = ["C901", "E501", "F403", "F841", "W605"]
lint.select = ["B", "B9", "C", "E", "F", "W", "I001"]

[tool.ruff.lint.mccabe]
max-complexity = 18

# This isn't used at the moment
[tool.pyright]
reportUnnecessaryTypeIgnoreComment = true
